[package]
name = "az-preview"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# AF_UNIX sockets on Windows (std has them only on unix): ctrl.sock from
# tools/az-boot-win.ps1. Nothing changes on macOS.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"
