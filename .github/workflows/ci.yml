name: ci

# The checks that need no deck system: formatting, Clippy and the unit tests of the
# AZ-EMU app on macOS and Windows, line endings, and that every Python tool compiles.
# The full suite (tools/az-emu-test.py) boots a pulled system, so it runs on a
# developer's machine, not here.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build
      - run: cargo test

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Line endings
        run: python3 tools/check-lf.py
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py
      - name: Python unit tests
        run: python3 tools/test_azemu.py
